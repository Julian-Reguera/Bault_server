# Perfil usado por los tests E2E. Se activa con @ActiveProfiles("test").
# Todo lo que aqui se define sobreescribe a application.properties y NO toca application-dev.properties.

# H2 en memoria: se destruye al terminar la JVM del test. DB_CLOSE_DELAY=-1 mantiene la BD
# viva entre conexiones dentro del mismo proceso de test.
# NON_KEYWORDS=USER evita que H2 rechace el DDL de la entidad User (la palabra USER
# está reservada en H2 moderno). DB_CLOSE_DELAY=-1 mantiene la BD viva entre conexiones.
spring.datasource.url=jdbc:h2:mem:baulttest;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# import.sql tiene INSERTs con VALUES en la línea siguiente; sin este extractor
# Hibernate parte cada línea por separado y los VALUES sueltos fallan (42001).
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=\
org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

# La consola H2 no aporta nada en tests.
spring.h2.console.enabled=false

# Logging silencioso para no ensuciar la salida de los tests.
logging.level.root=warn
logging.level.baultServer=info
logging.level.org.springframework.web=warn
logging.level.org.springframework.security=warn
logging.level.org.hibernate=warn

# JWT: secret dedicado a tests (no reutilizar en prod).
bault.jwt.secret=dGVzdC1zZWNyZXQtb25seS1mb3ItdGVzdHMtMzItYnl0ZXMtcGxlYXNlLQ==
bault.jwt.expiration-ms=900000
bault.jwt.refresh.expiration-ms=5184000000

# Transferencias
bault.transfer.download.max-mbps=0

# WebSocket: heartbeat bajo para que la detección de sesiones muertas sea rápida en tests
# (dev/prod usan 10000ms). Con 500ms una sesión muerta se libera en ~1s.
bault.ws.heartbeat.server-ms=500
bault.ws.heartbeat.client-ms=500

# Crypto (KEK dummy para tests)
bault.crypto.active-version=1
bault.crypto.keys.1=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Email: valores dummy para que ResendEmailService pueda instanciarse como bean sin
# depender de la variable de entorno RESEND_API_KEY. El bean real nunca se usa en tests:
# lo sobreescribe RecordingEmailService (ver E2ETestConfig).
bault.email.resend.api-key=test-dummy-key-not-used
bault.email.from=test@example.com
bault.email.app-name=BaultTest
bault.email.verification.ttl-minutes=15
bault.email.verification.cooldown-seconds=60
bault.email.verification.code-length=6

bault.debug=false
