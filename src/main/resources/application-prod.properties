# configuracion general de produccion
server.port=80
spring.thymeleaf.cache=true
spring.web.resources.chain.cache=true

# Configuracion Spring datasource (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Configuración JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configuración H2 (deshabilitada en prod)
spring.h2.console.enabled=false

# No exponer detalles de errores al cliente
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# Configuración logger
logging.level.root=warn
logging.level.baultServer=info
logging.level.org.hibernate=warn
logging.level.org.springframework.web=warn
logging.level.org.springframework.security=warn
logging.file.name=logs/bault.log

# Configuraciones propias
bault.debug=true

# JWT
bault.jwt.secret=${BAULT_JWT_SECRET}
bault.jwt.expiration-ms=900000
bault.jwt.refresh.expiration-ms=5184000000

# Crypto (KEK para wrap de DEKs de carpeta). 32 bytes base64 por env.
bault.crypto.active-version=1
bault.crypto.keys.1=${BAULT_CRYPTO_KEY_V1}

# Email (Resend). API key OBLIGATORIA por env var.
bault.email.resend.api-key=${RESEND_API_KEY}
bault.email.from=${BAULT_EMAIL_FROM}
bault.email.app-name=Bault
bault.email.verification.ttl-minutes=15
bault.email.verification.cooldown-seconds=60
bault.email.verification.code-length=6