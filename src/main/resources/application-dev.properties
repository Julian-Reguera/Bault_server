# configuracion general de desarrollo
server.port=8080
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

# Configuracion Spring datasource
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2

# Configuración JPA 
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:file:./bault
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=\
org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

# Configuración H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

server.error.include-message=always
server.error.include-stacktrace=always

# Configuración logger
logging.level.root=info
logging.level.org.hibernate=info
logging.level.org.springframework.web=debug
logging.level.org.springframework.security=debug

# Configuraciones propias
bault.debug=true

# JWT
bault.jwt.secret=Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcysK
bault.jwt.expiration-ms=900000
bault.jwt.refresh.expiration-ms=5184000000

# Transferencias: limite de descarga por transferencia (0 = sin limite)
bault.transfer.download.max-mbps=10
